name: Build Unsigned IPA

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: read   # প্রাইভেট রিপো হলে চেকআউটের জন্য জরুরি

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 120

    steps:
      # ১. পুরো রিপোজিটরি ডাউনলোড (এটি ছাড়া কোনো ফাইল পাওয়া যাবে না)
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0        # সম্পূর্ণ ইতিহাস
          submodules: recursive # সাবমডিউল থাকলে তাও নামাবে

      # ২. ফাইলগুলো সত্যিই এসেছে কিনা যাচাই (এরর হলে এখানেই থামবে)
      - name: Verify repository files
        run: |
          echo "=== বর্তমান ডিরেক্টরি ==="
          pwd
          echo "=== রুট ফাইলসমূহ ==="
          ls -la
          echo "=== scripts/ios ফোল্ডার ==="
          if [ -d "scripts/ios" ]; then
            ls -la scripts/ios/
          else
            echo "ERROR: scripts/ios ফোল্ডার পাওয়া যায়নি!" >&2
            exit 1
          fi
          test -f scripts/ios/build_deps.sh || { echo "ERROR: build_deps.sh নেই"; exit 1; }
          test -f scripts/ios/make_ipa.sh   || { echo "ERROR: make_ipa.sh নেই"; exit 1; }
          echo "সব প্রয়োজনীয় স্ক্রিপ্ট পাওয়া গেছে।"

      # ৩. বিল্ড টুল ইনস্টল
      - name: Install Ninja and CMake
        run: brew install ninja cmake

      # ৪. iOS ডিপেন্ডেন্সি বিল্ড
      - name: Build iOS dependencies
        run: |
          chmod +x scripts/ios/build_deps.sh
          scripts/ios/build_deps.sh "${{ github.workspace }}/ios-deps"
        env:
          IOS_DEPS: ${{ github.workspace }}/ios-deps

      # ৫. আনসাইনড IPA তৈরি
      - name: Build unsigned IPA
        run: |
          chmod +x scripts/ios/make_ipa.sh
          IOS_UNSIGNED=1 scripts/ios/make_ipa.sh
        env:
          IOS_DEPS: ${{ github.workspace }}/ios-deps

      # ৬. আর্টিফ্যাক্ট আপলোড
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpeedBreaker-unsigned-ipa
          path: build/ios/ipa/SpeedBreaker--ios.ipa
          if-no-files-found: error

      # ৭. ট্যাগ পুশ করলে Release-এও যুক্ত হবে
      - name: Upload IPA to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/ios/ipa/SpeedBreaker--ios.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
