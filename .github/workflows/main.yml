name: Build Unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    name: Build iOS App Unsigned
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Find and Build Xcode Project
        run: |
          set -e
          
          echo "Searching for Xcode workspace or project recursively..."
          XCODE_WORKSPACE=$(find . -name "*.xcworkspace" -maxdepth 4 -not -path '*/.*' | head -n 1)
          XCODE_PROJ=$(find . -name "*.xcodeproj" -maxdepth 4 -not -path '*/.*' | head -n 1)
          
          if [ -n "$XCODE_WORKSPACE" ]; then
            echo "Found Workspace: $XCODE_WORKSPACE"
            SCHEME=$(xcodebuild -workspace "$XCODE_WORKSPACE" -list | grep -A 10 "Schemes:" | tail -n +2 | head -n 1 | xargs)
            echo "Using Scheme: $SCHEME"
            
            xcodebuild -workspace "$XCODE_WORKSPACE" \
                       -scheme "$SCHEME" \
                       -configuration Release \
                       -sdk iphoneos \
                       -archivePath build/app.xcarchive \
                       CODE_SIGN_IDENTITY="" \
                       CODE_SIGNING_REQUIRED=NO \
                       CODE_SIGNING_ALLOWED=NO \
                       archive
                       
          elif [ -n "$XCODE_PROJ" ]; then
            echo "Found Project: $XCODE_PROJ"
            SCHEME=$(xcodebuild -project "$XCODE_PROJ" -list | grep -A 10 "Schemes:" | tail -n +2 | head -n 1 | xargs)
            echo "Using Scheme: $SCHEME"
            
            xcodebuild -project "$XCODE_PROJ" \
                       -scheme "$SCHEME" \
                       -configuration Release \
                       -sdk iphoneos \
                       -archivePath build/app.xcarchive \
                       CODE_SIGN_IDENTITY="" \
                       CODE_SIGNING_REQUIRED=NO \
                       CODE_SIGNING_ALLOWED=NO \
                       archive
          else
            echo "Error: No Xcode workspace or project found in the repository!"
            echo "Listing repository structure for debugging:"
            ls -R
            exit 1
          fi

      - name: Package Unsigned IPA
        run: |
          mkdir -p build/Payload
          cp -R build/app.xcarchive/Products/Applications/*.app build/Payload/
          cd build
          zip -r unsigned-app.ipa Payload
          cd ..

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-ios-ipa
          path: build/unsigned-app.ipa
