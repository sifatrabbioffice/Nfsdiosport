name: Build SpeedBreaker Unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    name: Build iOS IPA
    runs-on: macos-latest

    steps:
      # ১. রিপোজিটরির সমস্ত সোর্স কোড ও সাব-মডিউল ডাউনলোড
      - name: Checkout Repository with Submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # ২. ডিপেন্ডেন্সি প্যাকেজ ও ডিপেন্ডেন্সি স্ক্রিপ্ট বিল্ড
      - name: Build iOS Dependencies
        run: |
          set -e
          echo "Setting up dependencies folder and build..."
          mkdir -p ~/speedbreaker-ios-deps
          
          # স্ক্রিপ্ট ফাইলের পারমিশন দেওয়া ও রান করা
          if [ -f "Scripts/ios/build_deps.sh" ]; then
            chmod +x Scripts/ios/build_deps.sh
            Scripts/ios/build_deps.sh ~/speedbreaker-ios-deps
          elif [ -f "scripts/ios/build_deps.sh" ]; then
            chmod +x scripts/ios/build_deps.sh
            scripts/ios/build_deps.sh ~/speedbreaker-ios-deps
          else
            echo "Error: build_deps.sh script not found!"
            exit 1
          fi

      # ৩. অ্যাপের আসল সোর্স ফাইল খুঁজে বের করে Release IPA তৈরি
      - name: Build and Package Unsigned IPA
        run: |
          set -e
          
          # প্যাথ এনভায়রনমেন্ট ভ্যারিয়েবল সেটআপ
          export IOS_DEPS="$HOME/speedbreaker-ios-deps"
          export DEVELOPMENT_TEAM="A1B2C3D4E5"
          export IOS_BUNDLE_ID="com.speedbreaker.app"

          # বিল্ড স্ক্রিপ্ট থাকলে সরাসরি বিল্ড স্ক্রিপ্ট থেকে রান করা
          if [ -f "scripts/ios/build.sh" ] || [ -f "Scripts/ios/build.sh" ]; then
            BUILD_SCRIPT=$(find . -iwholename "*/ios/build.sh" | head -n 1)
            chmod +x "$BUILD_SCRIPT"
            "$BUILD_SCRIPT" install
          else
            echo "Falling back to xcodebuild..."
            PBX_FILE=$(find . -name "project.pbxproj" -not -path '*/.*' | head -n 1)
            XCODE_PROJ_DIR=$(dirname "$PBX_FILE")
            SCHEME=$(xcodebuild -project "$XCODE_PROJ_DIR" -list | grep -A 10 "Schemes:" | tail -n +2 | head -n 1 | xargs)
            
            xcodebuild -project "$XCODE_PROJ_DIR" \
                       -scheme "$SCHEME" \
                       -configuration Release \
                       -sdk iphoneos \
                       -archivePath build/app.xcarchive \
                       CODE_SIGN_IDENTITY="" \
                       CODE_SIGNING_REQUIRED=NO \
                       CODE_SIGNING_ALLOWED=NO \
                       archive
                       
            mkdir -p build/Payload
            cp -R build/app.xcarchive/Products/Applications/*.app build/Payload/
            cd build
            zip -r SpeedBreaker-unsigned.ipa Payload
            cd ..
          fi

      # ৪. চূড়ান্ত প্রস্তুতকৃত IPA ফাইল গিটহাব আর্টিফ্যাক্টে আপলোড করা
      - name: Upload Unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: SpeedBreaker-Unsigned-IPA
          path: |
            *.ipa
            build/*.ipa
            **/build/**/*.ipa
            build/app.xcarchive/Products/Applications/*.app
          if-no-files-found: error
